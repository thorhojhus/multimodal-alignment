hydra:
  job:
    chdir: true

wandb:
  enabled: false

model:
  downsample_factor: 10
  lm_model_name: "google/gemma-2-2b-it"
  load_in_4bit: false
  encoder_model_name: "openai/whisper-base"
  audio_tokenizer: false
  audio_tokenizer_vocab_size: 16384
  tiny_align: false

training:
  num_epochs: 3
  batch_size: 8
  lr: 3e-4
  warmup_steps: 50
  checkpoint_dir: "checkpoints"
  save_every_n_steps: 5000
  evaluate_every_n_steps: 1000
  resume_from_checkpoint: false
  resume_checkpoint_path: "checkpoints/checkpoint_latest.pt"
  log_every_n_steps: 10
  kl_loss: true
  kl_temp: 2.0

eval:
  n_samples: 128
  batch_size: 32
  full_eval: true


dataset:
  name: "librispeech"
  split: "train.clean.360"
  test_split: "test.clean"