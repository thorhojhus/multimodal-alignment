hydra:
  job:
    chdir: true
  run:
    dir: /work3/s224233/shared/outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
    
wandb:
  enabled: false
  run_name: "default"
  upload_audio: false

model:
  downsample_factor: 10
  lm_model_name: "google/gemma-2-2b-it"
  load_in_4bit: false
  encoder_model_name: "openai/whisper-base"
  projector: "simple" # can be simple (ultravox style), tinyalign, linear (one layer), conv
  token_length: 30
  audio_tokenizer: false
  audio_tokenizer_vocab_size: 16384
  train_llm: false
  train_encoder: false
  use_sparktts: true

training:
  num_epochs: 24
  batch_size: 8
  lr: 3e-4
  warmup_steps: 50
  checkpoint_dir: "checkpoints"
  evaluate_every_n_steps: 1000
  resume_from_checkpoint: false
  resume_checkpoint_path: "checkpoints/checkpoint_latest.pt"
  load_lr_from_checkpoint: false
  log_every_n_steps: 10
  loss: "ce" # can be kl_loss, embed_loss or ce
  kl_temp: 2.0

eval:
  n_samples: 128
  batch_size: null


dataset:
  name: "librispeech"
  split: "train.clean.360"
  test_split: "test.clean"
