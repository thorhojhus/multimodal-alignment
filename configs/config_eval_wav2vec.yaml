hydra:
  job:
    chdir: true
  run:
    dir: /work3/s224233/shared/outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}

wandb:
  enabled: false
  run_name: "default"
  upload_audio: false

model:
  downsample_factor: 10
  lm_model_name: "google/gemma-3-4b-it"
  load_in_4bit: true
  encoder_model_name: "facebook/w2v-bert-2.0"
  projector: "simple" # can be simple (ultravox style), tinyalign, linear (one layer), conv, transformer, simple-linear
  token_length: 30
  audio_tokenizer: false
  audio_tokenizer_vocab_size: 16384
  train_llm: false
  train_encoder: false
  expand_embeds: false # must use BiCodec as encoder_model_name if true
  train_encoder_wav2vec: false # if we want to train the transformer layers of the wav2vec model
  train_encoder_full: true

training:
  num_epochs: 0
  batch_size: 16
  gradient_accumulation_steps: 4
  gradient_clip_norm: 1.0
  lr: 3e-4
  warmup_steps: 500
  checkpoint_dir: "checkpoints"
  evaluate_every_n_steps: 1000
  resume_from_checkpoint: false
  resume_checkpoint_path: "checkpoints/checkpoint_latest.pt"
  load_lr_from_checkpoint: false
  log_every_n_steps: 10
  loss: "ce" # can be kl_loss, embed_loss or ce
  kl_temp: 2.0
  do_phonemize: false

eval:
  n_samples: 128
  batch_size: 16


dataset:
  augment: "none"
  name: "coral"
  split: "train"
  test_split: "test"
  do_filter: false
  min_audio_length: 1.0  # minimum audio length in seconds
  max_audio_length: 20.0  # maximum audio length in seconds
